[project]
name = "fast-api"
version = "0.1.0"
description = "A FastAPI application"
readme = "README.md"
authors = [
    { name = "Reza Faghani", email = "rfaghani91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "fast_api.main:app"
