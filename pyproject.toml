[project]
name = "fast-api"
version = "0.1.0"
description = "An ongoing FastAPI deep-dive project"
readme = "README.md"
authors = [
    { name = "Reza Faghani", email = "rfaghani91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "fast_api.main:app"
